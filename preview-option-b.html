<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Option B – Semantic Knowledge Graph</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: linear-gradient(180deg, #090f21 0%, #0e1f44 50%, #08112a 100%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', system-ui, sans-serif;
    gap: 1rem;
  }
  .label {
    color: rgba(255,255,255,0.35);
    font-size: 0.75rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
  }
  @keyframes ringPulse {
    0%, 100% { stroke-opacity: 0.18; }
    50%       { stroke-opacity: 0.45; }
  }
  @keyframes centerGlow {
    0%, 100% { filter: drop-shadow(0 0 8px rgba(245,195,110,0.45)); }
    50%       { filter: drop-shadow(0 0 22px rgba(245,195,110,0.85)); }
  }
  .orbit-ring  { animation: ringPulse 3s ease-in-out infinite; }
  .center-hub  { animation: centerGlow 2.5s ease-in-out infinite; }
</style>
</head>
<body>

<span class="label">Option B — Semantic Knowledge Graph</span>

<svg width="520" height="520" viewBox="0 0 520 520" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="rgba(245,195,110,0.09)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
    </radialGradient>
    <radialGradient id="cGrad" cx="38%" cy="32%" r="65%">
      <stop offset="0%"   stop-color="#f5c36e"/>
      <stop offset="100%" stop-color="#b97220"/>
    </radialGradient>
    <radialGradient id="nAE" cx="40%" cy="35%" r="60%">
      <stop offset="0%"   stop-color="#ff7070"/>
      <stop offset="100%" stop-color="#c0392b"/>
    </radialGradient>
    <radialGradient id="nDM" cx="40%" cy="35%" r="60%">
      <stop offset="0%"   stop-color="#60aadf"/>
      <stop offset="100%" stop-color="#2176ae"/>
    </radialGradient>
    <radialGradient id="nLB" cx="40%" cy="35%" r="60%">
      <stop offset="0%"   stop-color="#3ddb82"/>
      <stop offset="100%" stop-color="#1a9450"/>
    </radialGradient>
    <radialGradient id="nEX" cx="40%" cy="35%" r="60%">
      <stop offset="0%"   stop-color="#c590fc"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </radialGradient>
    <radialGradient id="nVS" cx="40%" cy="35%" r="60%">
      <stop offset="0%"   stop-color="#30dcf8"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </radialGradient>
    <radialGradient id="nCM" cx="40%" cy="35%" r="60%">
      <stop offset="0%"   stop-color="#fc9f50"/>
      <stop offset="100%" stop-color="#d14e0a"/>
    </radialGradient>

    <!-- Flow paths center→each satellite -->
    <path id="pAE" d="M260 250 L394 173"/>
    <path id="pDM" d="M260 250 L394 327"/>
    <path id="pLB" d="M260 250 L260 405"/>
    <path id="pEX" d="M260 250 L126 327"/>
    <path id="pVS" d="M260 250 L126 173"/>
    <path id="pCM" d="M260 250 L260 95"/>
  </defs>

  <!-- Background glow -->
  <circle cx="260" cy="260" r="210" fill="url(#bgGlow)"/>

  <!-- Orbit ring -->
  <circle class="orbit-ring" cx="260" cy="250" r="155"
          fill="none" stroke="#f5c36e" stroke-width="1"
          stroke-dasharray="5 7"/>

  <!-- Spoke lines -->
  <line x1="289" y1="227" x2="376" y2="178" stroke="rgba(255,112,112,0.38)" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="289" y1="273" x2="376" y2="322" stroke="rgba(90,160,212,0.38)" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="260" y1="283" x2="260" y2="377" stroke="rgba(46,204,113,0.38)" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="231" y1="273" x2="144" y2="322" stroke="rgba(192,132,252,0.38)" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="231" y1="227" x2="144" y2="178" stroke="rgba(34,211,238,0.38)" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="260" y1="217" x2="260" y2="123" stroke="rgba(251,146,60,0.38)" stroke-width="1.5" stroke-dasharray="5 4"/>

  <!-- Cross connections (subtle ring) -->
  <line x1="394" y1="173" x2="394" y2="327" stroke="rgba(255,255,255,0.06)" stroke-width="1" stroke-dasharray="3 6"/>
  <line x1="394" y1="173" x2="260" y2="95"  stroke="rgba(255,255,255,0.06)" stroke-width="1" stroke-dasharray="3 6"/>
  <line x1="260" y1="95"  x2="126" y2="173" stroke="rgba(255,255,255,0.06)" stroke-width="1" stroke-dasharray="3 6"/>
  <line x1="126" y1="173" x2="126" y2="327" stroke="rgba(255,255,255,0.06)" stroke-width="1" stroke-dasharray="3 6"/>
  <line x1="126" y1="327" x2="260" y2="405" stroke="rgba(255,255,255,0.06)" stroke-width="1" stroke-dasharray="3 6"/>
  <line x1="260" y1="405" x2="394" y2="327" stroke="rgba(255,255,255,0.06)" stroke-width="1" stroke-dasharray="3 6"/>

  <!-- Animated flow dots (outward) -->
  <circle r="3.5" fill="#ff7070" opacity="0">
    <animateMotion dur="2.2s" repeatCount="indefinite" begin="0.2s"><mpath href="#pAE"/></animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" dur="2.2s" repeatCount="indefinite" begin="0.2s"/>
  </circle>
  <circle r="3.5" fill="#60aadf" opacity="0">
    <animateMotion dur="2.4s" repeatCount="indefinite" begin="0.9s"><mpath href="#pDM"/></animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" dur="2.4s" repeatCount="indefinite" begin="0.9s"/>
  </circle>
  <circle r="3.5" fill="#3ddb82" opacity="0">
    <animateMotion dur="2.0s" repeatCount="indefinite" begin="1.4s"><mpath href="#pLB"/></animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" dur="2.0s" repeatCount="indefinite" begin="1.4s"/>
  </circle>
  <circle r="3.5" fill="#c590fc" opacity="0">
    <animateMotion dur="2.1s" repeatCount="indefinite" begin="0.6s"><mpath href="#pEX"/></animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" dur="2.1s" repeatCount="indefinite" begin="0.6s"/>
  </circle>
  <circle r="3.5" fill="#30dcf8" opacity="0">
    <animateMotion dur="2.3s" repeatCount="indefinite" begin="1.1s"><mpath href="#pVS"/></animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" dur="2.3s" repeatCount="indefinite" begin="1.1s"/>
  </circle>
  <circle r="3.5" fill="#fc9f50" opacity="0">
    <animateMotion dur="1.9s" repeatCount="indefinite" begin="0.4s"><mpath href="#pCM"/></animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" dur="1.9s" repeatCount="indefinite" begin="0.4s"/>
  </circle>

  <!-- ── Satellite nodes ── -->
  <!-- AE  top-right (394,173) -->
  <g>
    <circle cx="394" cy="173" r="33" fill="rgba(255,112,112,0.12)" stroke="rgba(255,112,112,0.55)" stroke-width="1.5"/>
    <circle cx="394" cy="173" r="24" fill="url(#nAE)"/>
    <text x="394" y="168" text-anchor="middle" font-size="11" font-weight="800" fill="white"              font-family="'Segoe UI',sans-serif">AE</text>
    <text x="394" y="180" text-anchor="middle" font-size="7.5" fill="rgba(255,255,255,0.7)"              font-family="'Segoe UI',sans-serif">Events</text>
    <text x="394" y="216" text-anchor="middle" font-size="9.5" fill="rgba(255,112,112,0.9)"              font-family="'Segoe UI',sans-serif">Adverse Events</text>
  </g>

  <!-- DM  bottom-right (394,327) -->
  <g>
    <circle cx="394" cy="327" r="33" fill="rgba(90,160,212,0.12)" stroke="rgba(90,160,212,0.55)" stroke-width="1.5"/>
    <circle cx="394" cy="327" r="24" fill="url(#nDM)"/>
    <text x="394" y="322" text-anchor="middle" font-size="11" font-weight="800" fill="white"              font-family="'Segoe UI',sans-serif">DM</text>
    <text x="394" y="334" text-anchor="middle" font-size="7.5" fill="rgba(255,255,255,0.7)"              font-family="'Segoe UI',sans-serif">Demo</text>
    <text x="394" y="370" text-anchor="middle" font-size="9.5" fill="rgba(90,160,212,0.9)"              font-family="'Segoe UI',sans-serif">Demographics</text>
  </g>

  <!-- LB  bottom (260,405) -->
  <g>
    <circle cx="260" cy="405" r="33" fill="rgba(46,204,113,0.12)" stroke="rgba(46,204,113,0.55)" stroke-width="1.5"/>
    <circle cx="260" cy="405" r="24" fill="url(#nLB)"/>
    <text x="260" y="400" text-anchor="middle" font-size="11" font-weight="800" fill="white"              font-family="'Segoe UI',sans-serif">LB</text>
    <text x="260" y="412" text-anchor="middle" font-size="7.5" fill="rgba(255,255,255,0.7)"              font-family="'Segoe UI',sans-serif">Lab</text>
    <text x="260" y="450" text-anchor="middle" font-size="9.5" fill="rgba(46,204,113,0.9)"              font-family="'Segoe UI',sans-serif">Laboratory</text>
  </g>

  <!-- EX  bottom-left (126,327) -->
  <g>
    <circle cx="126" cy="327" r="33" fill="rgba(192,132,252,0.12)" stroke="rgba(192,132,252,0.55)" stroke-width="1.5"/>
    <circle cx="126" cy="327" r="24" fill="url(#nEX)"/>
    <text x="126" y="322" text-anchor="middle" font-size="11" font-weight="800" fill="white"              font-family="'Segoe UI',sans-serif">EX</text>
    <text x="126" y="334" text-anchor="middle" font-size="7.5" fill="rgba(255,255,255,0.7)"              font-family="'Segoe UI',sans-serif">Exposure</text>
    <text x="126" y="370" text-anchor="middle" font-size="9.5" fill="rgba(192,132,252,0.9)"              font-family="'Segoe UI',sans-serif">Exposure</text>
  </g>

  <!-- VS  top-left (126,173) -->
  <g>
    <circle cx="126" cy="173" r="33" fill="rgba(34,211,238,0.12)" stroke="rgba(34,211,238,0.55)" stroke-width="1.5"/>
    <circle cx="126" cy="173" r="24" fill="url(#nVS)"/>
    <text x="126" y="168" text-anchor="middle" font-size="11" font-weight="800" fill="white"              font-family="'Segoe UI',sans-serif">VS</text>
    <text x="126" y="180" text-anchor="middle" font-size="7.5" fill="rgba(255,255,255,0.7)"              font-family="'Segoe UI',sans-serif">Vitals</text>
    <text x="126" y="216" text-anchor="middle" font-size="9.5" fill="rgba(34,211,238,0.9)"              font-family="'Segoe UI',sans-serif">Vital Signs</text>
  </g>

  <!-- CM  top (260,95) -->
  <g>
    <circle cx="260" cy="95" r="33" fill="rgba(251,146,60,0.12)" stroke="rgba(251,146,60,0.55)" stroke-width="1.5"/>
    <circle cx="260" cy="95" r="24" fill="url(#nCM)"/>
    <text x="260" y="90" text-anchor="middle" font-size="11" font-weight="800" fill="white"              font-family="'Segoe UI',sans-serif">CM</text>
    <text x="260" y="102" text-anchor="middle" font-size="7.5" fill="rgba(255,255,255,0.7)"              font-family="'Segoe UI',sans-serif">ConMed</text>
    <text x="260" y="52"  text-anchor="middle" font-size="9.5" fill="rgba(251,146,60,0.9)"              font-family="'Segoe UI',sans-serif">Concomitant Meds</text>
  </g>

  <!-- ── Center hub ── -->
  <circle cx="260" cy="250" r="55" fill="rgba(245,195,110,0.07)" stroke="rgba(245,195,110,0.2)" stroke-width="1.5">
    <animate attributeName="r"              values="53;59;53"   dur="2.6s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values="0.2;0.5;0.2" dur="2.6s" repeatCount="indefinite"/>
  </circle>
  <circle class="center-hub" cx="260" cy="250" r="44" fill="url(#cGrad)"/>
  <circle cx="260" cy="250" r="44" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>
  <text x="260" y="244" text-anchor="middle" font-size="10.5" font-weight="800" fill="#08112a"
        font-family="'Segoe UI',sans-serif" letter-spacing="0.8">KWALIFY™</text>
  <text x="260" y="259"  text-anchor="middle" font-size="8"    fill="rgba(8,17,42,0.72)"
        font-family="'Segoe UI',sans-serif">Semantic AI</text>
  <!-- inner pulse -->
  <circle cx="260" cy="250" r="4" fill="white" opacity="0.35">
    <animate attributeName="r"       values="3;8;3"     dur="1.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.35;0;0.35" dur="1.8s" repeatCount="indefinite"/>
  </circle>
</svg>

<span class="label">6 SDTM domains · animated semantic connections · gold = Kwalify intelligence layer</span>

</body>
</html>
